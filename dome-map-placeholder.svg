<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glass" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#eaf6ef"/>
      <stop offset="100%" stop-color="#cfe8d8"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fc6c9"/>
      <stop offset="100%" stop-color="#5a9ea3"/>
    </linearGradient>
  </defs>

  <!-- dome shell -->
  <circle cx="450" cy="450" r="420" fill="url(#glass)" stroke="#3a5a40" stroke-width="4"/>
  <circle cx="450" cy="450" r="420" fill="none" stroke="#3a5a40" stroke-width="1" stroke-dasharray="2 10" opacity="0.4"/>

  <!-- radial glazing bars -->
  <g stroke="#3a5a40" stroke-width="1.5" opacity="0.25">
    <line x1="450" y1="30" x2="450" y2="870"/>
    <line x1="30" y1="450" x2="870" y2="450"/>
    <line x1="140" y1="140" x2="760" y2="760"/>
    <line x1="760" y1="140" x2="140" y2="760"/>
  </g>

  <!-- central walkway ring -->
  <circle cx="450" cy="450" r="150" fill="none" stroke="#7c5c3e" stroke-width="14" opacity="0.35"/>

  <!-- fish tanks: two ellipses opposite each other -->
  <ellipse cx="450" cy="230" rx="95" ry="60" fill="url(#water)" stroke="#2a2a22" stroke-width="3"/>
  <text x="450" y="235" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1c3a3c" font-weight="700">TANK 1</text>

  <ellipse cx="450" cy="670" rx="95" ry="60" fill="url(#water)" stroke="#2a2a22" stroke-width="3"/>
  <text x="450" y="675" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1c3a3c" font-weight="700">TANK 2</text>

  <!-- overlapping jungle planting beds: irregular organic blobs around the ring -->
  <g fill="#6a9470" stroke="#3a5a40" stroke-width="2" opacity="0.85">
    <path d="M240 180 q60 -40 110 10 q30 40 -20 70 q-70 30 -110 -20 q-25 -35 20 -60z"/>
    <path d="M620 170 q70 -20 100 40 q15 50 -40 60 q-70 15 -90 -35 q-15 -45 30 -65z"/>
    <path d="M150 350 q50 -50 110 -20 q40 25 10 75 q-40 55 -100 30 q-55 -25 -20 -85z"/>
    <path d="M700 340 q55 -45 105 -5 q35 30 0 75 q-45 50 -100 15 q-50 -35 -5 -85z"/>
    <path d="M150 560 q40 -55 105 -30 q45 20 20 75 q-35 60 -100 35 q-60 -25 -25 -80z"/>
    <path d="M700 570 q50 -50 105 -15 q35 30 5 75 q-40 55 -100 25 q-55 -30 -10 -85z"/>
    <path d="M260 730 q60 -35 110 5 q30 35 -15 70 q-65 35 -110 -10 q-30 -30 15 -65z"/>
    <path d="M610 720 q65 -30 105 15 q25 40 -20 65 q-65 30 -105 -15 q-25 -35 20 -65z"/>
  </g>

  <!-- small vertical/hanging planters, tucked between the big beds -->
  <g fill="#c9a227" stroke="#3a5a40" stroke-width="2">
    <circle cx="330" cy="450" r="26"/>
    <circle cx="570" cy="450" r="26"/>
    <circle cx="450" cy="330" r="22"/>
    <circle cx="450" cy="570" r="22"/>
  </g>

  <text x="450" y="870" text-anchor="middle" font-family="serif" font-style="italic" font-size="18" fill="#3a5a40" opacity="0.6">
    placeholder layout — swap for your own dome drawing
  </text>
</svg>
